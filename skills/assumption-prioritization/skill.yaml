# Skill bundle (D-019). Skills confer no permissions: tools are still checked by the gateway.
key: assumption-prioritization
version: 1.0.0
owner: WS5 (AI/analysis) with domain reviewer sign-off
status: active
subject: case
purpose: >-
  Rank the case's assumptions by how much the decision depends on them, so validation tests the
  riskiest ones first.
screens: [S09]
prd: [ME-09]
allowed_tools: [economics.calculate, sizing.calculate, evidence.get]
output_schema: SkillOutput # see output.schema.json
allowed_proposal_types: [assumption_priority, claim]
budget:
  wall_time_ms: 300000
  max_tool_calls: 30
  max_input_tokens: 100000
  max_output_tokens: 6000
  max_cost_micros: 1500000
model: config:ANALYSIS_MODEL # configuration only; never an identifier in code
never:
  - approve, decide, sign or record outcomes
  - change an assumption value (propose a sensitivity only)
  - present a sensitivity as a probability or confidence score
  - cite an evidence id that was not returned to this run
