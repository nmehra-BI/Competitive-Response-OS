# Skill bundle (D-019). Skills confer no permissions: tools are still checked by the gateway.
key: mandate-to-search-plan
version: 0.1.0
owner: WS5 (AI/analysis) with domain reviewer sign-off
status: stub
purpose: >-
  Translate an approved mandate into bounded search criteria and candidate opportunities.
screens: [S02, S03]
prd: [ME-01, ME-03]
allowed_tools: [intelligence.search, evidence.get, portfolio.get_product]
output_schema: SkillOutput # @growth-os/contracts entities/analysis.ts
allowed_proposal_types: [search_plan, opportunity_candidate]
budget:
  wall_time_ms: 300000 # PRD §13: bounded initial brief within 5 minutes
  max_tool_calls: 40
  max_input_tokens: 120000
  max_output_tokens: 8000
model: config:ANALYSIS_MODEL # configuration only; never an identifier in code
never:
  - approve, decide, sign or record outcomes
  - present an assumption or inference as evidence
  - cite an evidence id that was not returned to this run
  - use restricted or unentitled source content
  - produce probability or confidence scores
