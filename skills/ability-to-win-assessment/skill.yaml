# Skill bundle (D-019). Skills confer no permissions: tools are still checked by the gateway.
key: ability-to-win-assessment
version: 1.0.0
owner: WS5 (AI/analysis) with domain reviewer sign-off
status: active
subject: case
purpose: >-
  Draft the questions specialists must answer about product fit, channel, regulation and competition.
  The agent drafts questions; people answer and sign.
screens: [S07]
prd: [ME-07]
allowed_tools: [intelligence.search, evidence.get, portfolio.get_product, crm.get_authorized_accounts]
output_schema: SkillOutput # see output.schema.json
allowed_proposal_types: [feasibility_question, claim]
budget:
  wall_time_ms: 300000
  max_tool_calls: 30
  max_input_tokens: 100000
  max_output_tokens: 6000
  max_cost_micros: 1500000
model: config:ANALYSIS_MODEL # configuration only; never an identifier in code
never:
  - approve, decide, sign or record outcomes
  - answer a feasibility question or substitute a green check for a specialist sign-off
  - hide or soften a blocker
  - cite an evidence id that was not returned to this run
  - produce probability or confidence scores
