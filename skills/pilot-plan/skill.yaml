# Skill bundle (D-019). Skills confer no permissions: tools are still checked by the gateway.
key: pilot-plan
version: 1.0.0
owner: WS5 (AI/analysis) with domain reviewer sign-off
status: active
subject: case
purpose: >-
  Draft the pilot task plan (owners, dependencies, deliverables) and internal message drafts for the
  approved pilot scope. Tasks are created only by a person after approval.
screens: [S11]
prd: [ME-11, ME-12]
allowed_tools: [work.preview_tasks, evidence.get]
output_schema: SkillOutput # see output.schema.json
allowed_proposal_types: [pilot_task, message_draft]
budget:
  wall_time_ms: 300000
  max_tool_calls: 20
  max_input_tokens: 100000
  max_output_tokens: 8000
  max_cost_micros: 1500000
model: config:ANALYSIS_MODEL # configuration only; never an identifier in code
never:
  - approve, decide, sign or record outcomes
  - create, send or sync tasks (work.preview_tasks is a dry run)
  - send prospect communications (message drafts stay drafts)
  - plan work outside the approved scope, sites, days or spend
