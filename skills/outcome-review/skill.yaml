# Skill bundle (D-019). Skills confer no permissions: tools are still checked by the gateway.
key: outcome-review
version: 1.0.0
owner: WS5 (AI/analysis) with domain reviewer sign-off
status: active
subject: case
purpose: >-
  Draft the outcome review: results against the pre-registered thresholds, what was learned, causal
  limitations and a recommendation. The recommendation is not a decision.
screens: [S12]
prd: [ME-13, ME-14]
allowed_tools: [evidence.get, economics.calculate]
output_schema: SkillOutput # see output.schema.json
allowed_proposal_types: [outcome_review_draft, claim]
budget:
  wall_time_ms: 300000
  max_tool_calls: 20
  max_input_tokens: 100000
  max_output_tokens: 6000
  max_cost_micros: 1500000
model: config:ANALYSIS_MODEL # configuration only; never an identifier in code
never:
  - approve, decide, sign or record outcomes (the recommendation is not a decision)
  - move a pre-registered threshold or re-score a recorded result
  - attribute revenue beyond what the pilot's own records show
  - produce probability or confidence scores
